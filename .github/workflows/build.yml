name: Build Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Pack (portable + installer)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\pack-release.ps1 -Target All

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: TransubPlayer-portable
          path: artifacts/pack/TransubPlayer-*-win-x64.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TransubPlayer-setup
          path: artifacts/pack/*-setup.exe

      # Phát hành bản mới để Win AIO (nút Transub-Player) tải được mà không cần đăng nhập GitHub
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Transub-Player build ${{ github.run_number }}
          make_latest: true
          files: |
            artifacts/pack/*-setup.exe
            artifacts/pack/TransubPlayer-*-win-x64.zip
